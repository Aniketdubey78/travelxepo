<!-- Main Post Card -->
<div class="post-card max-w-2xl mx-auto my-6 bg-white border border-gray-100 shadow-sm hover:shadow-md transition-shadow duration-300 rounded-xl overflow-hidden font-sans">
  
 
  <div class="post-top p-4 flex items-start justify-between gap-3">
    
    <div class="post-avatar av-a flex-shrink-0 w-12 h-12 bg-amber-500 text-white rounded-full flex items-center justify-center font-bold text-lg shadow-inner">
      {{posts?.authorId?.username | avatar}}
    </div>
    
    <div class="post-meta-col flex-grow">
      <div class="post-uname font-bold text-gray-900 text-[15px] flex items-center gap-1">
        {{posts?.authorId?.username}}
        <span class="verified text-blue-500 inline-flex items-center" *ngIf="isuserlogin">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
          </svg>
          <span class="text-[11px] ml-0.5 font-medium uppercase tracking-wider" >Verified</span>
        </span>
      </div>
      
      <div class="post-title text-gray-500 text-xs leading-relaxed mt-0.5">
       {{posts.title}}
      </div>
      
      
      <div class="flex flex-wrap gap-2 items-center mt-2.5">
        <div class="post-route-badge bg-gray-100 text-gray-700 px-2.5 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1 border border-gray-200">
          <svg class="w-3 h-3 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          {{posts.routefrom}} → {{posts.routeto}}
        </div>
        <span class="pop-badge bg-amber-100 text-amber-800 px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1 border border-amber-200 uppercase tracking-tight">
          <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M18 11h-5V6h5v5zm-7 0H6V6h5v5zm7 7h-5v-5h5v5zm-7 0H6v-5h5v5z"/></svg>
          {{posts.busoperator}}
        </span>
      </div>
    </div>

    <div class="flex flex-col items-end gap-1 flex-shrink-0">
      <span class="post-time text-gray-400 text-[11px] font-medium">{{posts.createdAt | timeago}}</span>
    </div>
  </div>

 
  <div class="flex flex-wrap gap-2 px-4 mb-3">
    <div class="postpitshop" *ngFor="let pit of posts.pitshops; let i = index">
      <div class="pitshop-name bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[10px] font-bold border border-blue-100 flex items-center gap-1">
        <svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 20 20"><path d="M3 3a1 1 0 000 2h11a1 1 0 100-2H3zM3 7a1 1 0 000 2h5a1 1 0 000-2H3zM3 11a1 1 0 100 2h4a1 1 0 100-2H3zM13 16a1 1 0 102 0v-5.586l1.293 1.293a1 1 0 001.414-1.414l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 101.414 1.414L13 10.414V16z"/></svg>
        {{pit}}
      </div>
    </div>
  </div>

 
  <div class="px-4 pb-3">
    <div class="post-highlist font-extrabold text-gray-900 text-lg leading-snug mb-2 italic decoration-amber-400 decoration-2">
      "{{posts.highlight}}"
    </div>
    <div class="post-body text-gray-600 text-[14px] leading-relaxed line-clamp-3 hover:line-clamp-none transition-all cursor-default">
      {{posts.fullstory}}
    </div>
  </div>

  
  <div class="post-photos px-4 pb-4">
    <div class="grid grid-cols-3 gap-1 rounded-lg overflow-hidden border border-gray-100">
      <div class="photos-grid-3 aspect-square overflow-hidden bg-gray-100" *ngFor="let photo of posts.image; let i = index">
        <img [src]="photo" alt="Post Photo {{i + 1}}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" />
      </div>
    </div>
  </div>
 
  <!-- Comment Row -->
  <div class="comment-input-row flex items-center gap-3 px-4 py-3 bg-gray-50 border-t border-b border-gray-100">
    <div class="comment-av w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px] font-bold shadow-sm">
      A
    </div>
    <input class="comment-input flex-grow bg-white border border-gray-200 rounded-full px-4 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition-all" placeholder="Add a comment…" name="content" [(ngModel)]="content" />
    <button class="text-amber-600 text-xs font-bold hover:text-amber-700 transition-colors pr-1 px-2 py-1 hover:scale-100 rounded-full" (click)="submitcomment()">Post</button>
  </div>

   <div class="explorebutton w-full p-1 mt-2 py-0" >
  
  <button id="Explorejourney" (click)="explore()"
          class="group relative w-full flex items-center justify-center gap-2.5 px-6 py-1 rounded-xl bg-gradient-to-r from-orange-400 via-amber-500 to-orange-500 hover:from-orange-400 hover:via-orange-500 hover:to-amber-500 active:scale-[0.99] text-white font-medium shadow-[0_4px_18px_rgba(245,158,11,0.25)] hover:shadow-[0_6px_24px_rgba(245,158,11,0.4)] border border-orange-300/20 transition-all duration-300 ease-out overflow-hidden cursor-pointer">
    
   
    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-in-out"></div>

    
    <div class="relative w-5 h-5 flex-shrink-0 flex items-center justify-center">
      <div class="absolute inset-0 bg-amber-300/30 rounded-full scale-0 group-hover:scale-120 group-hover:animate-ping transition-transform duration-300"></div>
      
      <svg xmlns="http://w3.org" 
           viewBox="0 0 24 24" 
           fill="none" 
           stroke="currentColor" 
           stroke-width="2.5" 
           stroke-linecap="round" 
           stroke-linejoin="round" 
           class="relative w-[18px] h-[18px] text-amber-50 group-hover:text-white group-hover:-translate-y-0.5 group-hover:rotate-6 transition-all duration-300 ease-out">
      
        <path d="M12 22C12 17 10 13 7 10" />
       
        <path d="M12 14c4-1 5-5 5-5s-4 0-5 5" />
       
        <path d="M12 18c3.5 0 5.5-2.5 5.5-2.5s-3-1-5.5 2.5" />
      
        <path d="M7 10c.5-2.5 2.5-3.5 2.5-3.5s-2 0-2.5 3.5" />
      </svg>
    </div>

    
    <span class="text-sm font-bold tracking-wider font-serif italic text-orange-50 group-hover:text-white transition-colors duration-200">
      Explore Full Journey
    </span>

    
    <svg xmlns="http://w3.org" 
         viewBox="0 0 24 24" 
         fill="none" 
         stroke="currentColor" 
         stroke-width="2.5" 
         stroke-linecap="round" 
         stroke-linejoin="round" 
         class="w-3.5 h-3.5 text-orange-200/80 group-hover:translate-x-1.5 transition-transform duration-300 flex-shrink-0">
      <path d="M5 12h14" />
      <path d="m12 5 7 7-7 7" />
    </svg>

  </button>
</div>

</div>
