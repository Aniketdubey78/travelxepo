<nav
  class="nav-container w-full border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 px-6 py-3 transition-colors duration-300">
  <div class="nav_items flex items-center justify-between max-w-7xl mx-auto">

    <!-- Logo Section with Animated Bus -->
    <div class="logo flex items-center gap-2 group cursor-pointer">
      <svg
        class="w-10 h-10 text-blue-600 dark:text-blue-400 transform group-hover:translate-x-2 transition-transform duration-500 ease-in-out"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path
          d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-1.1 0-2 .9-2 2v7c0 1.1.9 2 2 2h10" />
        <circle cx="7" cy="17" r="2" />
        <circle cx="17" cy="17" r="2" />
        <path d="M7 12h5" />
        <path d="M7 8h4" />
      </svg>
      <span class="text-xl font-bold text-gray-800 dark:text-white tracking-tight">Bus<span
          class="text-blue-600">Blog</span></span>
    </div>

    <!-- Right Content -->
    <div class="right-content flex items-center gap-6">

      <div *ngIf="!isLoggedin" class="sign-up">
        <button (click)="handleSignIn()"
          class="group relative flex items-center gap-2 px-4 py-2 text-sm font-semibold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20 hover:bg-blue-100 dark:hover:bg-blue-900/40 rounded-full transition-all duration-300 border border-blue-100 dark:border-blue-800/50 shadow-sm active:scale-95">
          <span>Sign In</span>
          <span
            class="absolute inset-0 rounded-full bg-blue-400/10 blur-md opacity-0 group-hover:opacity-100 transition-opacity"></span>
        </button>
      </div>

      <button *ngIf="isLoggedin" class="logout-btn" (click)="Signout()">
        <div
          class="inline-flex items-center gap-2 px-3 py-2 bg-rose-50/60 hover:bg-rose-600 text-rose-600 hover:text-white border border-rose-100 hover:border-rose-600 rounded-xl cursor-pointer transition-all duration-300 shadow-sm active:scale-95 group select-none max-w-fit">

          <svg
            class="w-4 h-4 text-rose-500 group-hover:text-white transition-transform duration-300 group-hover:translate-x-0.5 flex-shrink-0"
            viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M15.75 9V5.25C15.75 4.00736 14.7426 3 13.5 3H5.25C4.00736 3 3 4.00736 3 5.25V18.75C3 19.9926 4.00736 21 5.25 21H13.5C14.7426 21 15.75 19.9926 15.75 18.75V15"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M21 12H9M21 12L17.25 8.25M21 12L17.25 15.75" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <span class="text-xs sm:text-sm font-bold tracking-wide">
            Log Out
          </span>

        </div>

      </button>

      <div class="nav_item2 block lg:hidden">
        <button type="button"
          class="relative p-2.5 text-slate-500 hover:text-indigo-600 bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-100 rounded-xl transition-all duration-200 shadow-sm focus:outline-none active:scale-95 group"
          aria-label="View notifications">

          <svg class="w-6 h-6 fill-current transition-transform duration-300 group-hover:rotate-12" viewBox="0 0 24 24"
            xmlns="http://w3.org">
            <path
              d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
          </svg>

        </button>
      </div>


      <div class="nav_items3">
        <button id="theme-toggle" (click)="toggletheme()"
          class="relative inline-flex items-center justify-center w-10 h-10 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 transition-all duration-300 overflow-hidden shadow-sm border border-gray-200 dark:border-gray-700">


          <svg *ngIf="isDark" id="theme-toggle-dark-icon"
            class="hidden w-6 h-6 transform transition-all duration-500 hover:rotate-12" fill="none"
            stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>


          <svg *ngIf="!isDark" id="theme-toggle-light-icon"
            class="hidden w-6 h-6 transform transition-all duration-500 hover:rotate-90" fill="none"
            stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M3 12h2.25m.386-6.364l1.591 1.591M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>

        </button>

    </div>
