<!-- Main Wrapper: overflow-hidden + h-screen ensures no scroll -->
<div class="relative h-screen w-full flex items-center justify-center overflow-hidden font-sans">
  
  <!-- Background Image Layer -->
  <div class="absolute inset-0 z-0">
    <!-- w-full h-full + object-cover makes image big and sharp -->
    <img src="/assets/loginb.jpg" alt="Bus Background" class="w-full h-full object-center" />
    <!-- Slightly darker overlay for better text readability -->
    <div class="absolute inset-0 bg-black/50 backdrop-blur-[2px]"></div>
  </div>

  <!-- Login Card: Width fixed to max-w-sm for a compact look -->
  <div class="relative z-10 w-full max-w-sm mx-4 bg-black/40 backdrop-blur-xl border border-white/10 p-8 rounded-[2rem] shadow-2xl overflow-y-auto max-h-[95vh]">
    
    <div class="text-center mb-6">
      <h2 class="text-3xl font-black text-white tracking-tight">Welcome Back</h2>
      <p class="text-gray-300 text-xs mt-1 font-medium">Log in to your BusBlog account</p>
    </div>

    <!-- Form: Reduced gap to prevent overflow -->
    <form class="space-y-4" (ngSubmit)="onsubmit()">
      
      <!-- Email -->
      <div class="relative">
        <input type="email" name="email" id="email" required placeholder="Email Address" 
               class="w-full px-5 py-3 bg-white/10 border border-white/20 rounded-xl text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all" 
               [(ngModel)]="email">
      </div>

      <!-- Password -->
      <div class="relative">
        <input type="password" name="password" id="password" required placeholder="Password" 
               class="w-full px-5 py-3 bg-white/10 border border-white/20 rounded-xl text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all" 
               [(ngModel)]="password">
      </div>

      <!-- Login Button -->
      <button type="submit" 
              class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all active:scale-[0.96] mt-2 text-sm">
        Login
      </button>

      <!-- OR Separator -->
      <div class="flex items-center py-2">
        <div class="flex-grow border-t border-white/10"></div>
        <span class="px-3 text-white/30 text-[9px] font-bold uppercase tracking-widest">Secure Connect</span>
        <div class="flex-grow border-t border-white/10"></div>
      </div>

      <!-- Google Sign In: items-center fixed -->
      <div class="w-full flex items-center justify-center p-1  rounded-xl hover:bg-white/10 transition-colors cursor-pointer">
        <div id="google-btn" *ngIf="!isLoggedin" class="w-full flex justify-center scale-90"></div>
      </div>
    </form>

    <!-- Footer: Reduced margin -->
    <div class="text-center mt-6">
      <p class="text-gray-400 text-xs">
        New in BusBlog?
        <button (click)="navigateToRegister()" class="text-orange-500 font-bold hover:text-orange-400 transition-colors ml-1 underline decoration-orange-500/30 underline-offset-4">
          Register Now
        </button>
      </p>
    </div>
  </div>
</div>
